<!doctype html>
<!--
Design brief: the assembly is primary; current phase and component count are secondary;
the structure disclaimer is tertiary. One primary action: scroll / scrub the assembly.
Plain HTML/CSS + Three.js, no UI library or Tailwind, no dark-mode variant.
Reuse project tokens: ink #252c2e, paper #f8f9f6, surface #e9edeb, accent #deb66b.
Type: Microsoft YaHei / PingFang SC; spacing 8 / 16 / 24 / 32; visible focus, 44px controls.
Composition: full-screen machining-table stage, small corner annotations, quiet bottom controls.
The distinctive event is the user-controlled perspective flight; surrounding UI stays still.
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="独立炮塔铣床三维装配演示：所有零件从左右两侧同时飞入，在中央旋绕一圈后一起组装。">
  <title>铣床 · 飞入装配</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="mill-stage" class="stage" data-renderer="loading" data-progress="0" data-assembled="0" aria-label="铣床滚动装配演示">
    <div id="scene" class="scene" role="img" aria-label="炮塔铣床所有零件从左右两侧同时飞入，在中央旋绕一圈后一起组装"></div>
    <header class="heading">
      <div>
        <h1>铣床 · 飞入装配</h1>
        <p id="interaction-hint">滚动，飞入、旋绕、一起组装</p>
      </div>
      <div class="assembly-status" aria-label="当前装配状态">
        <p id="phase-name">等待滚动</p>
        <p><span id="assembled-count">0</span><span class="status-separator">/</span><span id="total-count">—</span> 组件</p>
      </div>
    </header>
    <div id="first-hint" class="first-hint">
      <span class="scroll-mark" aria-hidden="true"></span>
      <p>向下滚动</p>
      <span>所有零件飞入，旋绕一圈后一起组装</span>
    </div>
    <p id="active-part" class="active-part" aria-hidden="true"></p>
    <section id="fallback" class="fallback" hidden aria-labelledby="fallback-title">
      <h2 id="fallback-title">当前浏览器无法显示三维画面</h2>
      <p>请使用开启硬件加速的浏览器重新打开。模型包含以下六组组件：</p>
      <ol><li>底座、立柱与升降机构</li><li>鞍座、工作台与进给机构</li><li>炮塔回转座与滑枕</li><li>主轴、套筒与轴承</li><li>机头壳体、电机与传动机构</li><li>手轮、刀具和紧固件</li></ol>
    </section>
    <footer class="controls" aria-label="装配控制">
      <div class="scrub-row">
        <label for="assembly-progress">装配进度</label>
        <input id="assembly-progress" type="range" min="0" max="1000" value="0" step="1" aria-valuetext="0%">
        <output id="progress-value" for="assembly-progress">0%</output>
      </div>
      <div class="control-bottom">
        <p class="disclaimer">通用结构演示 · 首版无纹理</p>
        <div class="actions">
          <button id="replay" type="button">重播</button>
          <button id="inspect" type="button" aria-pressed="false">查看内部</button>
          <button id="complete" type="button">查看完成</button>
        </div>
      </div>
    </footer>
    <noscript><p class="noscript">此交互演示需要 JavaScript。铣床结构包含底座、立柱、工作台、炮塔、滑枕、铣头、主轴和电机。</p></noscript>
  </main>
  <div class="scroll-track" aria-hidden="true"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
